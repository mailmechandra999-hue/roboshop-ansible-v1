
- name: Create EC2 instances and Route53 records
  hosts: localhost
  connection: local

  vars:
    instances:
      - mongodb
      - redis
      - mysql
      - rabbitmq

    instance_action: create
    domain_name: buyany.store
    ami_id: ami-0055977a6e828a4f4
    region: us-east-1

  tasks:
    - name: Create EC2 instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        security_groups:
          - roboshop-ssh-common
          - "roboshop-{{ item }}"
        region: "{{ region }}"
        state: present
      loop: "{{ instances }}"
      when: instance_action == "create"
      register: ec2_output

    - name: print ec2 creation ec2_output
      debug: 
        msg: "{{ ec2_output }}"
