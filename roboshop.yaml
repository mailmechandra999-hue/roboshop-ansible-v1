
- name: Create EC2 instances and Route53 records
  hosts: localhost
  connection: local

  vars:
    instances:
      - mongodb
      - redis
      - mysql
      - rabbitmq

    instance_action: create
    domain_name: buyany.store
    ami_id: ami-0055977a6e828a4f4
    region: us-east-1

  tasks:
    - name: Create EC2 instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        security_groups:
          - roboshop-ssh-common
          - "roboshop-{{ item }}"
        region: "{{ region }}"
        state: present
      loop: "{{ instances }}"
      when: instance_action == "create"
      register: ec2_output

    # - name: print ec2 creation ec2_output
    #   debug: 
    #     msg: "{{ ec2_output }}"

    - name: create r53 records
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: instance_action == "create"

    - name: delete r53 records
      mazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{item}}.{{ domain_name }}"
        type: A
        ttl: 1
      loop: "{{instances}}"
      when: instance_action == "delete"

    - name: Terminate EC2 instance
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        region: us-east-1
        state: absent
        wait: false
      loop: "{{ instances }}"
      when: instance_action == "delete"

